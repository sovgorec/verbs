<body>
  <div class="container">
    <header>
      <span class="flag">🇪🇸</span>
      <h1 class="app-title">Борис Бирюков</h1>
      <div class="toggle">
        <label for="themeToggle">Тёмная тема</label>
        <input type="checkbox" id="themeToggle">
      </div>
    </header>

    <div class="selects">
      <select id="categorySelect"></select>
      <select id="verbSelect"></select>
    </div>

    <div class="tabs">
      <button class="tab active" id="tabPast">Прошедшее</button>
      <button class="tab" id="tabPresent">Настоящее</button>
      <button class="tab" id="tabFuture">Будущее</button>
    </div>

    <div class="verb-card" id="verbCard">
      <div class="conjugation">
        <div class="col">
          <p><b>yo</b> <span id="yoForm"></span></p>
          <p><b>tú</b> <span id="tuForm"></span></p>
          <p><b>él/ella</b> <span id="elForm"></span></p>
        </div>
        <div class="col">
          <p><b>nosotros</b> <span id="nosForm"></span></p>
          <p><b>vosotros</b> <span id="vosForm"></span></p>
          <p><b>ellos</b> <span id="ellosForm"></span></p>
        </div>
      </div>
    </div>

    <div class="examples">
      <select id="examplesDropdown"></select>
    </div>

    <div class="nav-buttons">
      <button id="prevVerb">◀ Назад</button>
      <button id="nextVerb">Далее ▶</button>
    </div>
  </div>
</body>
