<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerboPlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <span class="flag">🇪🇸</span>
      <h1 class="app-title">VerboPlay</h1>
      <div class="toggle">
        <label for="themeToggle">Тёмная тема</label>
        <input type="checkbox" id="themeToggle">
      </div>
    </header>

    <div class="selects">
      <select id="categorySelect">
        <option value="">Выбери категорию</option>
      </select>
      <select id="verbSelect">
        <option value="">Выбери глагол</option>
      </select>
    </div>

    <div class="tabs">
      <button class="tab active" data-tense="presente">Настоящее</button>
      <button class="tab" data-tense="pasado">Прошедшее</button>
      <button class="tab" data-tense="futuro">Будущее</button>
    </div>

    <div class="verb-card" id="verbCard">
      <div class="conjugation">
        <div class="col">
          <p><b>yo</b> <span id="yoForm"></span></p>
          <p><b>tú</b> <span id="tuForm"></span></p>
          <p><b>él/ella</b> <span id="elForm"></span></p>
        </div>
        <div class="col">
          <p><b>nosotros</b> <span id="nosForm"></span></p>
          <p><b>vosotros</b> <span id="vosForm"></span></p>
          <p><b>ellos</b> <span id="ellosForm"></span></p>
        </div>
      </div>
    </div>

    <div class="examples">
      <select id="examplesDropdown">
        <option>Примеры...</option>
      </select>
    </div>

    <div class="nav-buttons">
      <button id="prevVerb">◀ Назад</button>
      <button id="nextVerb">Далее ▶</button>
    </div>
  </div>

  <script src="verbsData.js"></script>
  <script src="app.js"></script>
</body>
</html>
