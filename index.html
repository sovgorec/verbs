<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VerboPlay — неправильные глаголы</title>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f8fb;
      color: #0b1220;
      transition: background 0.3s, color 0.3s;
    }

    body.dark {
      background-color: #1a1a1a;
      color: #f4f4f4;
    }

    header {
      text-align: center;
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
      background-color: #14a2ff;
      color: white;
    }

    .switcher {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 15px auto;
    }

    .switcher input {
      width: 20px;
      height: 20px;
    }

    #verbs-container {
      padding: 15px;
      max-width: 700px;
      margin: auto;
    }

    .verb-block {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      transition: 0.2s ease;
    }

    body.dark .verb-block {
      background: #2a2a2a;
      box-shadow: 0 4px 10px rgba(255,255,255,0.05);
    }

    .verb-block:hover {
      transform: translateY(-2px);
    }

    .verb-block h3 {
      margin-top: 0;
      color: #14a2ff;
    }

    body.dark .verb-block h3 {
      color: #4ea7ff;
    }

    .tense {
      font-weight: bold;
      margin-top: 10px;
      color: #1a936f;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #14a2ff;
      color: white;
      text-align: center;
      padding: 15px;
      font-weight: bold;
    }

    footer button {
      background: white;
      color: #14a2ff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      margin: 0 8px;
      font-size: 15px;
      cursor: pointer;
      font-family: 'Roboto', sans-serif;
      transition: 0.2s;
    }

    footer button:hover {
      background: #e3f4ff;
    }

    body.dark footer {
      background: #005b99;
    }
  </style>
</head>
<body>
  <header>🇪🇸 VerboPlay — неправильные глаголы</header>

  <div class="switcher">
    <label for="darkMode">🌙 Тёмная тема</label>
    <input type="checkbox" id="darkMode">
  </div>

  <div id="verbs-container">
    <p style="text-align:center;">Загрузка данных...</p>
  </div>

  <footer>
    <button onclick="loadVerbs('Популярные')">Популярные</button>
    <button onclick="loadVerbs('В доме')">В доме</button>
    <button onclick="loadVerbs('В спорте')">В спорте</button>
  </footer>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwwJzeNyVS0m6WUrWE-xQKxYYByLV3qcVLSiQlt011vkXrqqyAfoVL6U-0JhyWV-aHW/exec';
    const container = document.getElementById('verbs-container');

    async function loadVerbs(category = 'Популярные') {
      container.innerHTML = '<p style="text-align:center;">⏳ Загрузка...</p>';
      try {
        const res = await fetch(`${API_URL}?category=${encodeURIComponent(category)}`);
        const data = await res.json();
        renderVerbs(data);
      } catch (err) {
        container.innerHTML = '<p style="color:red;text-align:center;">Ошибка загрузки данных 😢</p>';
        console.error(err);
      }
    }

    function renderVerbs(data) {
      container.innerHTML = '';
      if (!data || data.length === 0) {
        container.innerHTML = '<p style="text-align:center;">Нет данных для этой категории.</p>';
        return;
      }

      const grouped = {};
      data.forEach(r => {
        if (!grouped[r.verb]) grouped[r.verb] = [];
        grouped[r.verb].push(r);
      });

      for (const [verb, items] of Object.entries(grouped)) {
        const block = document.createElement('div');
        block.className = 'verb-block';
        const ru = items[0]?.ru || '';
        block.innerHTML = `<h3>${verb} — <i>${ru}</i></h3>` +
          items.map(i =>
            `<p><span class='tense'>${i.tense}</span> — ${i.pronoun}: <b>${i.form}</b><br>${i.example_es} <i>(${i.example_ru})</i></p>`
          ).join('');
        container.appendChild(block);
      }
    }

    // Темная тема
    const darkToggle = document.getElementById('darkMode');
    darkToggle.addEventListener('change', e => {
      document.body.classList.toggle('dark', e.target.checked);
    });

    // Загружаем по умолчанию
    window.addEventListener('DOMContentLoaded', () => loadVerbs());
  </script>
</body>
</html>
