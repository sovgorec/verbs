<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerboPlay</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1 class="flag">🇪🇸</h1>
      <div class="toggle">
        <label class="switch">
          <input type="checkbox" id="themeToggle">
          <span class="slider"></span>
        </label>
      </div>
    </header>

    <div class="selects">
      <select id="categorySelect">
        <option value="">Выбери категорию</option>
      </select>
      <select id="verbSelect">
        <option value="">Выбери глагол</option>
      </select>
    </div>

    <div class="tabs">
      <button class="tab active" data-tense="presente">Настоящее</button>
      <button class="tab" data-tense="pasado">Прошедшее</button>
      <button class="tab" data-tense="futuro">Будущее</button>
    </div>

    <div id="verbCard" class="verb-card"></div>

    <div class="examples">
      <select id="examplesDropdown">
        <option>Примеры...</option>
      </select>
    </div>
  </div>

  <div class="bottom-nav">
    <button id="prevVerb">◀ Назад</button>
    <button id="nextVerb">Далее ▶</button>
  </div>

  <script src="verbsData.js"></script>
  <script src="app.js"></script>
</body>
</html>
